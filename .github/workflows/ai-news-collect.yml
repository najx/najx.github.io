name: AI news — daily collect

on:
  schedule:
    # 05:17 UTC. An odd minute on purpose: GitHub's scheduler queues every
    # cron set to the top of the hour together, and runs can drift 5-30
    # minutes at those peaks.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Hours of history to keep"
        required: false
        default: "48"
      dry_run:
        description: "Print the result instead of committing it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check the push token is configured
        env:
          NEWSBOT_TOKEN: ${{ secrets.NEWSBOT_TOKEN }}
        run: |
          if [ -z "$NEWSBOT_TOKEN" ]; then
            echo "::error::NEWSBOT_TOKEN is not set. A commit pushed with the" \
                 "default GITHUB_TOKEN does not trigger other workflows, so" \
                 "jekyll.yml would never rebuild and the home page would keep" \
                 "showing yesterday's headlines. Create a fine-grained PAT with" \
                 "Contents: read and write on this repository and save it as" \
                 "the NEWSBOT_TOKEN secret."
            exit 1
          fi

      - name: Checkout
        # Aucun jeton ici, et persist-credentials: false pour qu'aucune
        # identification ne reste dans .git/config pendant que du code tiers
        # s'exécute. Le NEWSBOT_TOKEN n'est fourni qu'à l'étape qui pousse.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install newsbot
        # Verrou à hashes : rien ne s'installe qui ne soit exactement l'archive
        # compilée dans tools/newsbot/requirements.txt. --no-build-isolation
        # parce que setuptools y figure aussi, donc pip n'a plus rien à aller
        # chercher sans vérification.
        run: |
          set -euo pipefail
          pip install --require-hashes --no-deps -r tools/newsbot/requirements.txt
          pip install --no-deps --no-build-isolation ./tools/newsbot

      - name: Collect
        env:
          # Jev ranks the day's stories. Without it the collection still
          # publishes, newest first, and says so in the log.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Through the environment, never interpolated into the script body:
          # ${{ }} is substituted before the shell sees the line, so a dispatch
          # input could otherwise run arbitrary commands on the runner.
          WINDOW: ${{ inputs.window || '48' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -euo pipefail
          case "$WINDOW" in
            ''|*[!0-9]*) echo "::error::window must be a whole number of hours"; exit 1 ;;
          esac
          newsbot -v collect --window "$WINDOW" ${DRY_RUN:+--dry-run}

      - name: Commit
        if: ${{ !inputs.dry_run }}
        env:
          NEWSBOT_TOKEN: ${{ secrets.NEWSBOT_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Le checkout n'a persisté aucune identification : on la pose ici, et
          # dans un en-tête plutôt que dans l'URL du remote, pour que le jeton
          # n'apparaisse ni dans une trace de commande ni dans un message
          # d'erreur de git.
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$NEWSBOT_TOKEN" | base64 | tr -d '\n')"
          git add _data/news.json .newsbot
          if git diff --cached --quiet; then
            echo "No change in the headlines; nothing to commit."
            exit 0
          fi
          git commit -m "AI news: $(date -u +%Y-%m-%d) collection

          Automated run of .github/workflows/ai-news-collect.yml."

          # Fetching twenty feeds takes a few minutes, so main may have moved
          # since checkout. This job only ever touches _data/news.json and
          # .newsbot/, so replaying it on top of whatever landed is safe.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push after three attempts"
          exit 1
