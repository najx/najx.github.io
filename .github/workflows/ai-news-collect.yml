name: AI news — daily collect

on:
  schedule:
    # 05:17 UTC. An odd minute on purpose: GitHub's scheduler queues every
    # cron set to the top of the hour together, and runs can drift 5-30
    # minutes at those peaks.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Hours of history to keep"
        required: false
        default: "48"
      dry_run:
        description: "Print the result instead of committing it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check the push token is configured
        env:
          NEWSBOT_TOKEN: ${{ secrets.NEWSBOT_TOKEN }}
        run: |
          if [ -z "$NEWSBOT_TOKEN" ]; then
            echo "::error::NEWSBOT_TOKEN is not set. A commit pushed with the" \
                 "default GITHUB_TOKEN does not trigger other workflows, so" \
                 "jekyll.yml would never rebuild and the home page would keep" \
                 "showing yesterday's headlines. Create a fine-grained PAT with" \
                 "Contents: read and write on this repository and save it as" \
                 "the NEWSBOT_TOKEN secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.NEWSBOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install newsbot
        run: pip install ./tools/newsbot

      - name: Collect
        env:
          # Jev ranks the day's stories. Without it the collection still
          # publishes, newest first, and says so in the log.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Through the environment, never interpolated into the script body:
          # ${{ }} is substituted before the shell sees the line, so a dispatch
          # input could otherwise run arbitrary commands on the runner.
          WINDOW: ${{ inputs.window || '48' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -euo pipefail
          case "$WINDOW" in
            ''|*[!0-9]*) echo "::error::window must be a whole number of hours"; exit 1 ;;
          esac
          newsbot -v collect --window "$WINDOW" ${DRY_RUN:+--dry-run}

      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/news.json .newsbot
          if git diff --cached --quiet; then
            echo "No change in the headlines; nothing to commit."
            exit 0
          fi
          git commit -m "AI news: $(date -u +%Y-%m-%d) collection

          Automated run of .github/workflows/ai-news-collect.yml."

          # Fetching twenty feeds takes a few minutes, so main may have moved
          # since checkout. This job only ever touches _data/news.json and
          # .newsbot/, so replaying it on top of whatever landed is safe.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push after three attempts"
          exit 1
