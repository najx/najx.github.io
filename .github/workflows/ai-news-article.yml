name: AI news — weekly article

on:
  schedule:
    # Sunday 06:17 UTC, an hour after the last collection of the week.
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      candidate:
        description: "Take the Nth eligible subject instead of the first"
        required: false
        default: "0"
      days:
        description: "How far back to look for a subject"
        required: false
        default: "7"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-news-article
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are configured
        env:
          NEWSBOT_TOKEN: ${{ secrets.NEWSBOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$NEWSBOT_TOKEN" ] || { echo "::error::NEWSBOT_TOKEN is not set; the pull request cannot be opened."; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY is not set; there is nothing to draft with."; exit 1; }

      - name: Checkout
        # Aucun jeton ici, et persist-credentials: false pour qu'aucune
        # identification ne reste dans .git/config pendant que du code tiers
        # s'exécute. Le NEWSBOT_TOKEN n'est fourni qu'à l'étape qui pousse.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install newsbot
        # Verrou à hashes : rien ne s'installe qui ne soit exactement l'archive
        # compilée dans tools/newsbot/requirements.txt. --no-build-isolation
        # parce que setuptools y figure aussi, donc pip n'a plus rien à aller
        # chercher sans vérification.
        run: |
          set -euo pipefail
          pip install --require-hashes --no-deps -r tools/newsbot/requirements.txt
          pip install --no-deps --no-build-isolation ./tools/newsbot

      - name: Draft
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CANDIDATE: ${{ inputs.candidate || '0' }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          set -uo pipefail
          case "$CANDIDATE$DAYS" in *[!0-9]*) echo "::error::inputs must be whole numbers"; exit 1 ;; esac
          set +e
          newsbot -v article --candidate "$CANDIDATE" --days "$DAYS" \
            --checks-out checks.json 2>&1 | tee run.log
          status=${PIPESTATUS[0]}
          set -e
          # 2 means nothing cleared the bar. That is a normal quiet week, not
          # a failure: publish nothing and say so.
          if [ "$status" = "2" ]; then
            echo "nothing_to_write=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No subject cleared the bar this week; no article drafted."
            exit 0
          fi
          exit "$status"

      - name: Open the pull request
        if: steps.draft.outputs.nothing_to_write != 'true'
        env:
          GH_TOKEN: ${{ secrets.NEWSBOT_TOKEN }}
          NEWSBOT_TOKEN: ${{ secrets.NEWSBOT_TOKEN }}
        run: |
          set -euo pipefail
          # Le checkout n'a persisté aucune identification : on la pose ici, et
          # dans un en-tête plutôt que dans l'URL du remote, pour que le jeton
          # n'apparaisse ni dans une trace de commande ni dans un message
          # d'erreur de git.
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$NEWSBOT_TOKEN" | base64 | tr -d '\n')"
          # Ask git for the file, not for `git status --porcelain`, which
          # collapses an untracked directory to "?? _posts/" and would make
          # every branch feat/auto-article-. on every run.
          post=$(git ls-files --others --exclude-standard -- '_posts/**/*.md' | head -1)
          [ -n "$post" ] || { echo "::error::the draft step wrote no post"; exit 1; }
          slug=$(basename "$(dirname "$post")")
          [ "$slug" != "_posts" ] && [ "$slug" != "." ] \
            || { echo "::error::could not derive a slug from $post"; exit 1; }
          branch="feat/auto-article-$slug"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # .newsbot/state.json travels with the post: it is what stops the
          # same subject being drafted again next Sunday, and it only takes
          # effect once this branch is merged.
          git add _posts .newsbot/state.json
          git commit -m "Article : $slug

          Rédigé automatiquement par .github/workflows/ai-news-article.yml.
          À relire avant publication."
          git push -u origin "$branch"

          {
            echo "Brouillon hebdomadaire. **Rien n'est publié tant que cette PR n'est pas mergée et sortie de l'état brouillon.**"
            echo
            echo "## À cocher avant de passer la PR en \"Ready for review\""
            echo
            # The checklist is built from checks.json, the citation checker's
            # own machine-readable output — not by scraping run.log, which
            # breaks the moment a flagged sentence contains text the scraper
            # mistakes for one of its own markers.
            python3 - <<'PY'
          import json, pathlib

          path = pathlib.Path("checks.json")
          if not path.exists():
              print("- [ ] Vérification des citations indisponible : relire l'article "
                    "en entier avant de sortir du brouillon (voir le journal ci-dessous).")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              unsupported = data.get("unsupported", [])
              if not unsupported:
                  print(f"- [ ] Aucune affirmation non étayée sur {data.get('checked', 0)} "
                        "vérifiées par Jev — à confirmer en relisant l'article.")
              else:
                  for f in unsupported:
                      sentence = f["sentence"].replace("\n", " ").strip()
                      print(f"- [ ] [{f['support']:.2f}] {sentence}")
          PY
            echo "- [ ] Le bloc de divulgation en fin d'article, que la charte impose."
            echo "- [ ] Le tag choisi, qui doit rester l'un des six existants."
            echo
            echo "## Journal de la sélection et de la vérification"
            echo
            # A long fence, and backticks stripped from the log: a headline
            # containing ``` would otherwise close the block early and let the
            # rest of the log render as markdown in a public comment.
            echo '~~~~'
            tr -d '`' < run.log
            echo '~~~~'
          } > body.md
          gh pr create --draft --base main --head "$branch" \
            --title "Article : $slug" --body-file body.md
