name: AI news — weekly report

on:
  schedule:
    # Sunday 06:17 UTC, an hour after the last collection of the week.
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "How far back the week reaches"
        required: false
        default: "7"
      stories:
        description: "How many stories get a section"
        required: false
        default: "6"
      dry_run:
        description: "Draft to a preview artifact; open no pull request, mark nothing covered"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-news-weekly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are configured
        env:
          NEWSBOT_TOKEN: ${{ secrets.NEWSBOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          [ -n "$NEWSBOT_TOKEN" ] || { echo "::error::NEWSBOT_TOKEN is not set; the pull request cannot be opened."; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY is not set; there is nothing to draft with."; exit 1; }
          [ -n "$TYPESAFE_API_KEY" ] || { echo "::error::TYPESAFE_API_KEY is not set; the stories cannot be selected."; exit 1; }

      - name: Checkout
        # Aucun jeton ici, et persist-credentials: false pour qu'aucune
        # identification ne reste dans .git/config pendant que du code tiers
        # s'exécute. Le NEWSBOT_TOKEN n'est fourni qu'à l'étape qui pousse.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install newsbot
        # Verrou à hashes : rien ne s'installe qui ne soit exactement l'archive
        # compilée dans tools/newsbot/requirements.txt. --no-build-isolation
        # parce que setuptools y figure aussi, donc pip n'a plus rien à aller
        # chercher sans vérification.
        run: |
          set -euo pipefail
          pip install --require-hashes --no-deps -r tools/newsbot/requirements.txt
          pip install --no-deps --no-build-isolation ./tools/newsbot

      - name: Draft the report
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Through the environment, never interpolated into the script body:
          # ${{ }} is substituted before the shell sees the line.
          DAYS: ${{ inputs.days || '7' }}
          STORIES: ${{ inputs.stories || '6' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -uo pipefail
          case "$DAYS$STORIES" in *[!0-9]*) echo "::error::inputs must be whole numbers"; exit 1 ;; esac
          set +e
          newsbot -v weekly --days "$DAYS" --stories "$STORIES" \
            --checks-out checks.json ${DRY_RUN:+--out preview} 2>&1 | tee run.log
          status=${PIPESTATUS[0]}
          set -e
          # 2 means fewer than three stories cleared the bar. That is a quiet
          # week, not a failure: publish nothing and say so.
          if [ "$status" = "2" ]; then
            echo "nothing_to_write=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Too few stories cleared the bar this week; no report drafted."
            exit 0
          fi
          exit "$status"

      - name: Upload the preview
        if: inputs.dry_run && steps.draft.outputs.nothing_to_write != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-weekly-preview
          path: |
            preview/_ai_news/
            checks.json
            run.log

      - name: Open the pull request
        if: ${{ !inputs.dry_run && steps.draft.outputs.nothing_to_write != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.NEWSBOT_TOKEN }}
          NEWSBOT_TOKEN: ${{ secrets.NEWSBOT_TOKEN }}
        run: |
          set -euo pipefail
          # Le checkout n'a persisté aucune identification : on la pose ici, et
          # dans un en-tête plutôt que dans l'URL du remote, pour que le jeton
          # n'apparaisse ni dans une trace de commande ni dans un message
          # d'erreur de git.
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$NEWSBOT_TOKEN" | base64 | tr -d '\n')"
          # Ask git for the file, not for `git status --porcelain`, which
          # collapses an untracked directory to "?? _ai_news/".
          report=$(git ls-files --others --exclude-standard -- '_ai_news/*.md' | head -1)
          [ -n "$report" ] || { echo "::error::the draft step wrote no report"; exit 1; }
          week=$(basename "$report" .md)
          branch="feat/ai-weekly-$week"

          # A previous run may have pushed the report before PR creation
          # failed. Reuse that branch without replacing its reviewed content.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            if gh pr view "$branch" --json url --jq .url; then
              echo "::notice::The weekly pull request already exists."
              exit 0
            fi
            {
              echo "Rapport hebdomadaire $week. **Cette PR reste en brouillon jusqu'à relecture.**"
              echo
              echo "Cette branche a été créée par une exécution précédente dont l'ouverture de PR a échoué."
              echo "Relire le rapport et vérifier ses citations avant de passer la PR en Ready for review."
            } > body.md
            gh pr create --draft --base main --head "$branch" \
              --title "AI Weekly $week" --body-file body.md
            exit 0
          fi

          python3 -m newsbot.pr_body --week "$week" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --checks checks.json --log run.log --out body.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # .newsbot/state.json travels with the report: it is what stops the
          # same stories getting a section again, and it only takes effect
          # once this branch is merged.
          git add _ai_news .newsbot/state.json
          git commit -m "AI Weekly $week

          Rédigé automatiquement par .github/workflows/ai-news-article.yml.
          À relire avant publication."
          git push -u origin "$branch"

          gh pr create --draft --base main --head "$branch" \
            --title "AI Weekly $week" --body-file body.md
