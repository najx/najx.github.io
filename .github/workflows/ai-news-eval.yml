name: AI news — judge calibration

# À la main seulement. Fait juger par Jev le jeu étalon de
# tools/newsbot/eval/headlines.jsonl et publie l'accord question par
# question, avec chaque désaccord, dans le journal et dans un artefact.
# À lancer avant de merger tout changement de rubrique dans judge.py.
on:
  workflow_dispatch:
    inputs:
      min_agreement:
        description: "Échouer si une question est en dessous de ce taux (0-1, vide = jamais)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Check the key is configured
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          [ -n "$TYPESAFE_API_KEY" ] || { echo "::error::TYPESAFE_API_KEY is not set; nothing can be judged."; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install newsbot
        run: |
          set -euo pipefail
          pip install --require-hashes --no-deps -r tools/newsbot/requirements.txt
          pip install --no-deps --no-build-isolation ./tools/newsbot

      - name: Judge the labelled set
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          MIN_AGREEMENT: ${{ inputs.min_agreement }}
        run: |
          set -euo pipefail
          case "$MIN_AGREEMENT" in
            ''|0|1|0.[0-9]*|1.0) ;;
            *) echo "::error::min_agreement must be a rate between 0 and 1"; exit 1 ;;
          esac
          newsbot -v eval --json eval.json ${MIN_AGREEMENT:+--min-agreement "$MIN_AGREEMENT"} 2>&1 | tee eval.log

      - name: Upload the tally
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: judge-calibration
          path: |
            eval.json
            eval.log
