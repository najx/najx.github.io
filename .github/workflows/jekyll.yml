name: Build and Deploy Jekyll

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed, not a single shared "pages" group. GitHub keeps only one pending run
  # per group, so with every PR and every push in the same group a queued PR
  # build evicts a pending main deploy — and that deploy is the one that puts
  # the site live.
  group: pages-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only a real push to main publishes. Today the github-pages environment
    # already refuses anything but main/master, so a PR's deploy job shows up
    # as "skipped" — and before that policy existed it showed up as a failed
    # check (three red runs on 2026-09-03). Stating the rule here puts it in
    # the repository instead of in a setting no reader of this file can see,
    # keeps PR checks clean, and holds if the environment policy is ever
    # relaxed. Pull requests still run `build`, which is what validates them.
    if: github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
