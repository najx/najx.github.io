<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">HTTPS hides content, not all metadata</title><desc id="desc">What the provider observes depends on encryption and configuration. Visibility varies: encrypted DNS and ECH can hide additional metadata.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#223747"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#69ddce"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#101923"/><rect width="960" height="540" rx="16" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="47" font-size="13" fill="#ff727b" letter-spacing="3">NAJX / FIELD NOTES</text><text x="40" y="99" font-size="32" fill="#edf4fa" font-weight="650">HTTPS hides content, not all metadata</text><text x="40" y="135" font-size="18" fill="#adc0d0" >What the provider observes depends on encryption and configuration.</text>
<rect x="40" y="200" width="250" height="178" rx="12" fill="#192735" stroke="#385166"/><path d="M60 222h24" stroke="#69ddce" stroke-width="4"/><text x="60" y="262" font-size="24" fill="#edf4fa" >Your device</text><text x="60" y="296" font-size="18" fill="#adc0d0" >HTTPS connection</text><path d="M295 290L386 290" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="200" width="250" height="178" rx="12" fill="#192735" stroke="#385166"/><path d="M420 222h24" stroke="#ff727b" stroke-width="4"/><text x="420" y="262" font-size="24" fill="#edf4fa" >Internet provider</text><text x="420" y="296" font-size="18" fill="#adc0d0" >Traffic still passes here</text><path d="M655 290L706 290" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><rect x="720" y="200" width="200" height="178" rx="12" fill="#192735" stroke="#385166"/><path d="M740 222h24" stroke="#69ddce" stroke-width="4"/><text x="740" y="262" font-size="24" fill="#edf4fa" >Website</text><text x="740" y="296" font-size="18" fill="#adc0d0" >TLS endpoint</text><text x="60" y="344" font-size="19" fill="#69ddce" >Encrypted content</text><text x="420" y="344" font-size="19" fill="#ff727b" >IP · timing · volume</text>
<path d="M40 484H920" stroke="#385166"/><text x="40" y="515" font-size="16" fill="#adc0d0" >Visibility varies: encrypted DNS and ECH can hide additional metadata.</text><text x="920" y="515" font-size="20" fill="#ff727b" text-anchor="end">↗</text></g></svg>
