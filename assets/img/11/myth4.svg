<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">A VPN moves the point of trust</title><desc id="desc">The tunnel protects traffic to the VPN; accounts and cookies still identify you. HTTPS still matters beyond the VPN. A VPN does not remove website tracking.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#223747"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#69ddce"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#101923"/><rect width="960" height="540" rx="16" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="47" font-size="13" fill="#ff727b" letter-spacing="3">NAJX / FIELD NOTES</text><text x="40" y="99" font-size="32" fill="#edf4fa" font-weight="650">A VPN moves the point of trust</text><text x="40" y="135" font-size="18" fill="#adc0d0" >The tunnel protects traffic to the VPN; accounts and cookies still identify you.</text>
<rect x="40" y="226" width="205" height="146" rx="12" fill="#192735" stroke="#385166"/><path d="M60 248h24" stroke="#69ddce" stroke-width="4"/><text x="60" y="288" font-size="24" fill="#edf4fa" >Device</text><text x="60" y="322" font-size="18" fill="#adc0d0" >VPN tunnel</text><rect x="265" y="226" width="205" height="146" rx="12" fill="#192735" stroke="#385166"/><path d="M285 248h24" stroke="#69ddce" stroke-width="4"/><text x="285" y="288" font-size="24" fill="#edf4fa" >ISP</text><text x="285" y="322" font-size="18" fill="#adc0d0" >Sees VPN link</text><rect x="490" y="226" width="205" height="146" rx="12" fill="#192735" stroke="#385166"/><path d="M510 248h24" stroke="#ff727b" stroke-width="4"/><text x="510" y="288" font-size="24" fill="#edf4fa" >VPN</text><text x="510" y="322" font-size="18" fill="#adc0d0" >New trust point</text><rect x="715" y="226" width="205" height="146" rx="12" fill="#192735" stroke="#385166"/><path d="M735 248h24" stroke="#69ddce" stroke-width="4"/><text x="735" y="288" font-size="24" fill="#edf4fa" >Website</text><text x="735" y="322" font-size="18" fill="#adc0d0" >Sees activity</text><path d="M248 293L262 293" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><path d="M473 293L487 293" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><path d="M698 293L712 293" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><path d="M62 207V187H674V207" fill="none" stroke="#69ddce" stroke-width="3"/><text x="368" y="178" font-size="20" fill="#69ddce" text-anchor="middle">Encrypted VPN tunnel</text>
<path d="M40 484H920" stroke="#385166"/><text x="40" y="515" font-size="16" fill="#adc0d0" >HTTPS still matters beyond the VPN. A VPN does not remove website tracking.</text><text x="920" y="515" font-size="20" fill="#ff727b" text-anchor="end">↗</text></g></svg>
