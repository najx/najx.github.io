<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">The router sits at the junction</title><desc id="desc">Connected devices leave signals in the home network. Device presence, timing and network events depend on router settings.</desc>
