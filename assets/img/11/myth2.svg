<rect width="960" height="540" rx="16" fill="#101923"/><rect width="960" height="540" rx="16" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="47" font-size="13" fill="#ff727b" letter-spacing="3">NAJX / FIELD NOTES</text><text x="40" y="99" font-size="32" fill="#edf4fa" font-weight="650">The router sits at the junction</text><text x="40" y="135" font-size="18" fill="#adc0d0" >Connected devices leave signals in the home network.</text>
<rect x="40" y="179" width="195" height="68" rx="12" fill="#192735" stroke="#385166"/><text x="62" y="221" font-size="22" fill="#edf4fa" >Phone</text><path d="M236 213L393 305" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="271" width="195" height="68" rx="12" fill="#192735" stroke="#385166"/><text x="62" y="313" font-size="22" fill="#edf4fa" >Laptop</text><path d="M236 305L393 305" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="363" width="195" height="68" rx="12" fill="#192735" stroke="#385166"/><text x="62" y="405" font-size="22" fill="#edf4fa" >Smart TV</text><path d="M236 397L393 305" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><rect x="410" y="210" width="235" height="190" rx="12" fill="#192735" stroke="#385166"/><path d="M430 232h24" stroke="#ff727b" stroke-width="4"/><text x="430" y="272" font-size="24" fill="#edf4fa" >Home router</text><text x="430" y="306" font-size="18" fill="#adc0d0" >Network observations</text><path d="M649 305L709 305" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><rect x="725" y="231" width="195" height="149" rx="12" fill="#192735" stroke="#385166"/><path d="M745 253h24" stroke="#69ddce" stroke-width="4"/><text x="745" y="293" font-size="24" fill="#edf4fa" >Internet</text><text x="745" y="327" font-size="18" fill="#adc0d0" >External services</text><text x="430" y="366" font-size="18" fill="#adc0d0" >Logs vary by device</text>
