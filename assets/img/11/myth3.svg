<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">A secure connection is not anonymity</title><desc id="desc">HTTPS protects data in transit; a website can still recognize a visitor. Encryption and protection against tracking address different threats.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#223747"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#69ddce"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#101923"/><rect width="960" height="540" rx="16" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="47" font-size="13" fill="#ff727b" letter-spacing="3">NAJX / FIELD NOTES</text><text x="40" y="99" font-size="32" fill="#edf4fa" font-weight="650">A secure connection is not anonymity</text><text x="40" y="135" font-size="18" fill="#adc0d0" >HTTPS protects data in transit; a website can still recognize a visitor.</text>
<rect x="40" y="204" width="250" height="170" rx="12" fill="#192735" stroke="#385166"/><path d="M60 226h24" stroke="#69ddce" stroke-width="4"/><text x="60" y="266" font-size="24" fill="#edf4fa" >Browser</text><text x="60" y="300" font-size="18" fill="#adc0d0" >Your device</text><path d="M295 284L651 284" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><text x="475" y="252" font-size="23" fill="#69ddce" text-anchor="middle">Encrypted transit</text><rect x="670" y="185" width="250" height="225" rx="12" fill="#192735" stroke="#385166"/><path d="M690 207h24" stroke="#ff727b" stroke-width="4"/><text x="690" y="247" font-size="24" fill="#edf4fa" >Website</text><text x="690" y="281" font-size="18" fill="#adc0d0" >Identity signals</text><text x="690" y="325" font-size="21" fill="#adc0d0" >Account · cookies</text><text x="690" y="361" font-size="21" fill="#adc0d0" >Browser fingerprint</text>
<path d="M40 484H920" stroke="#385166"/><text x="40" y="515" font-size="16" fill="#adc0d0" >Encryption and protection against tracking address different threats.</text><text x="920" y="515" font-size="20" fill="#ff727b" text-anchor="end">↗</text></g></svg>
