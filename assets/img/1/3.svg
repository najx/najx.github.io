<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">When one update reaches everyone</title><desc id="desc">A shared dependency can turn a local failure into widespread disruption. Conceptual illustration of the July 2024 outage, not a photograph.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#223747"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#69ddce"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#101923"/><rect width="960" height="540" rx="16" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="47" font-size="13" fill="#ff727b" letter-spacing="3">NAJX / FIELD NOTES</text><text x="40" y="99" font-size="32" fill="#edf4fa" font-weight="650">When one update reaches everyone</text><text x="40" y="135" font-size="18" fill="#adc0d0" >A shared dependency can turn a local failure into widespread disruption.</text>
<rect x="40" y="210" width="220" height="132" rx="12" fill="#192735" stroke="#385166"/><path d="M60 232h24" stroke="#ff727b" stroke-width="4"/><text x="60" y="272" font-size="24" fill="#edf4fa" >Software update</text><text x="60" y="306" font-size="18" fill="#adc0d0" >Shared distribution</text><path d="M260 276L375 276" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="190" width="210" height="172" rx="12" fill="#192735" stroke="#385166"/><path d="M410 212h24" stroke="#ff727b" stroke-width="4"/><text x="410" y="252" font-size="24" fill="#edf4fa" >Windows hosts</text><text x="410" y="286" font-size="18" fill="#adc0d0" >Affected endpoints</text><path d="M600 276L706 276" fill="none" stroke="#69ddce" stroke-width="3" marker-end="url(#arrow)"/><rect x="720" y="180" width="200" height="76" rx="12" fill="#192735" stroke="#385166"/><text x="742" y="227" font-size="22" fill="#edf4fa" >Airports</text><rect x="720" y="274" width="200" height="76" rx="12" fill="#192735" stroke="#385166"/><text x="742" y="321" font-size="22" fill="#edf4fa" >Hospitals</text><rect x="720" y="368" width="200" height="76" rx="12" fill="#192735" stroke="#385166"/><text x="742" y="415" font-size="22" fill="#edf4fa" >Businesses</text>
<path d="M40 484H920" stroke="#385166"/><text x="40" y="515" font-size="16" fill="#adc0d0" >Conceptual illustration of the July 2024 outage, not a photograph.</text><text x="920" y="515" font-size="20" fill="#ff727b" text-anchor="end">↗</text></g></svg>
