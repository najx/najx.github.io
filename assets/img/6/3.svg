<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Inside an IPv6 address</title><desc id="desc">Eight groups of four hexadecimal digits; each group contains 16 bits. Example /64 split using the documentation prefix 2001:db8::/32.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#223747"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#69ddce"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#101923"/><rect width="960" height="540" rx="16" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="47" font-size="13" fill="#ff727b" letter-spacing="3">NAJX / FIELD NOTES</text><text x="40" y="99" font-size="32" fill="#edf4fa" font-weight="650">Inside an IPv6 address</text><text x="40" y="135" font-size="18" fill="#adc0d0" >Eight groups of four hexadecimal digits; each group contains 16 bits.</text>
<rect x="40" y="214" width="103" height="88" rx="12" fill="#192735" stroke="#385166"/><text x="91.5" y="251" font-size="24" fill="#69ddce" text-anchor="middle">2001</text><text x="91.5" y="282" font-size="15" fill="#adc0d0" text-anchor="middle">16 bits</text><rect x="151" y="214" width="103" height="88" rx="12" fill="#192735" stroke="#385166"/><text x="202.5" y="251" font-size="24" fill="#69ddce" text-anchor="middle">0db8</text><text x="202.5" y="282" font-size="15" fill="#adc0d0" text-anchor="middle">16 bits</text><rect x="262" y="214" width="103" height="88" rx="12" fill="#192735" stroke="#385166"/><text x="313.5" y="251" font-size="24" fill="#69ddce" text-anchor="middle">0000</text><text x="313.5" y="282" font-size="15" fill="#adc0d0" text-anchor="middle">16 bits</text><rect x="373" y="214" width="103" height="88" rx="12" fill="#192735" stroke="#385166"/><text x="424.5" y="251" font-size="24" fill="#69ddce" text-anchor="middle">0000</text><text x="424.5" y="282" font-size="15" fill="#adc0d0" text-anchor="middle">16 bits</text><rect x="484" y="214" width="103" height="88" rx="12" fill="#192735" stroke="#385166"/><text x="535.5" y="251" font-size="24" fill="#ff727b" text-anchor="middle">0000</text><text x="535.5" y="282" font-size="15" fill="#adc0d0" text-anchor="middle">16 bits</text><rect x="595" y="214" width="103" height="88" rx="12" fill="#192735" stroke="#385166"/><text x="646.5" y="251" font-size="24" fill="#ff727b" text-anchor="middle">0000</text><text x="646.5" y="282" font-size="15" fill="#adc0d0" text-anchor="middle">16 bits</text><rect x="706" y="214" width="103" height="88" rx="12" fill="#192735" stroke="#385166"/><text x="757.5" y="251" font-size="24" fill="#ff727b" text-anchor="middle">0000</text><text x="757.5" y="282" font-size="15" fill="#adc0d0" text-anchor="middle">16 bits</text><rect x="817" y="214" width="103" height="88" rx="12" fill="#192735" stroke="#385166"/><text x="868.5" y="251" font-size="24" fill="#ff727b" text-anchor="middle">0001</text><text x="868.5" y="282" font-size="15" fill="#adc0d0" text-anchor="middle">16 bits</text><path d="M40 330L476 330" fill="none" stroke="#69ddce" stroke-width="3"/><path d="M484 330L920 330" fill="none" stroke="#ff727b" stroke-width="3"/><text x="258" y="366" font-size="22" fill="#69ddce" text-anchor="middle">Network prefix /64</text><text x="702" y="366" font-size="22" fill="#ff727b" text-anchor="middle">Interface identifier</text><text x="480" y="432" font-size="28" fill="#edf4fa" text-anchor="middle">Compressed: 2001:db8::1/64</text>
<path d="M40 484H920" stroke="#385166"/><text x="40" y="515" font-size="16" fill="#adc0d0" >Example /64 split using the documentation prefix 2001:db8::/32.</text><text x="920" y="515" font-size="20" fill="#ff727b" text-anchor="end">↗</text></g></svg>
