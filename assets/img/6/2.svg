<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Inside an IPv4 address</title><desc id="desc">Four decimal octets, each representing eight bits. Documentation address. The prefix length determines the network/host split.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#223747"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#69ddce"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#101923"/><rect width="960" height="540" rx="16" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="47" font-size="13" fill="#ff727b" letter-spacing="3">NAJX / FIELD NOTES</text><text x="40" y="99" font-size="32" fill="#edf4fa" font-weight="650">Inside an IPv4 address</text><text x="40" y="135" font-size="18" fill="#adc0d0" >Four decimal octets, each representing eight bits.</text>
<rect x="70" y="225" width="160" height="110" rx="12" fill="#192735" stroke="#385166"/><text x="150" y="286" font-size="40" fill="#69ddce" text-anchor="middle">192</text><text x="150" y="315" font-size="16" fill="#adc0d0" text-anchor="middle">8 bits</text><text x="255" y="287" font-size="38" fill="#adc0d0" >.</text><rect x="290" y="225" width="160" height="110" rx="12" fill="#192735" stroke="#385166"/><text x="370" y="286" font-size="40" fill="#69ddce" text-anchor="middle">0</text><text x="370" y="315" font-size="16" fill="#adc0d0" text-anchor="middle">8 bits</text><text x="475" y="287" font-size="38" fill="#adc0d0" >.</text><rect x="510" y="225" width="160" height="110" rx="12" fill="#192735" stroke="#385166"/><text x="590" y="286" font-size="40" fill="#69ddce" text-anchor="middle">2</text><text x="590" y="315" font-size="16" fill="#adc0d0" text-anchor="middle">8 bits</text><text x="695" y="287" font-size="38" fill="#adc0d0" >.</text><rect x="730" y="225" width="160" height="110" rx="12" fill="#192735" stroke="#385166"/><text x="810" y="286" font-size="40" fill="#ff727b" text-anchor="middle">123</text><text x="810" y="315" font-size="16" fill="#adc0d0" text-anchor="middle">8 bits</text><text x="480" y="201" font-size="26" fill="#edf4fa" text-anchor="middle">192.0.2.123 / 24</text><path d="M70 365L670 365" fill="none" stroke="#69ddce" stroke-width="3"/><path d="M730 365L890 365" fill="none" stroke="#ff727b" stroke-width="3"/><text x="370" y="403" font-size="22" fill="#69ddce" text-anchor="middle">Network prefix · 24 bits</text><text x="810" y="403" font-size="22" fill="#ff727b" text-anchor="middle">Host · 8 bits</text>
<path d="M40 484H920" stroke="#385166"/><text x="40" y="515" font-size="16" fill="#adc0d0" >Documentation address. The prefix length determines the network/host split.</text><text x="920" y="515" font-size="20" fill="#ff727b" text-anchor="end">↗</text></g></svg>
