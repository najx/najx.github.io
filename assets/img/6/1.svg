<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">IPv4 &amp; IPv6 address space</title><desc id="desc">IPv6 expands the address from 32 to 128 bits. Numbers shown directly; panel sizes are not proportional to address counts.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#223747"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#69ddce"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#101923"/><rect width="960" height="540" rx="16" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="40" y="47" font-size="13" fill="#ff727b" letter-spacing="3">NAJX / FIELD NOTES</text><text x="40" y="99" font-size="32" fill="#edf4fa" font-weight="650">IPv4 &amp; IPv6 address space</text><text x="40" y="135" font-size="18" fill="#adc0d0" >IPv6 expands the address from 32 to 128 bits.</text>
<rect x="40" y="185" width="410" height="245" rx="12" fill="#192735" stroke="#385166"/><rect x="470" y="185" width="450" height="245" rx="12" fill="#192735" stroke="#385166"/><text x="66" y="230" font-size="24" fill="#ff727b" >IPv4</text><text x="66" y="285" font-size="56" fill="#edf4fa" >2³²</text><text x="66" y="329" font-size="24" fill="#adc0d0" >≈ 4.3 billion addresses</text><text x="66" y="393" font-size="20" fill="#ff727b" >32-bit address</text><text x="496" y="230" font-size="24" fill="#69ddce" >IPv6</text><text x="496" y="285" font-size="56" fill="#edf4fa" >2¹²⁸</text><text x="496" y="329" font-size="24" fill="#adc0d0" >≈ 3.4 × 10³⁸ addresses</text><text x="496" y="393" font-size="20" fill="#69ddce" >128-bit address</text>
<path d="M40 484H920" stroke="#385166"/><text x="40" y="515" font-size="16" fill="#adc0d0" >Numbers shown directly; panel sizes are not proportional to address counts.</text><text x="920" y="515" font-size="20" fill="#ff727b" text-anchor="end">↗</text></g></svg>
