<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {% if page.layout == 'post' %}
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.modified | default: page.date | date_to_xmlschema | jsonify }},
  "author": {"@type": "Person", "name": {{ site.author.name | jsonify }}, "url": {{ '/about/' | absolute_url | jsonify }}},
  "publisher": {"@type": "Person", "name": {{ site.author.name | jsonify }}, "url": {{ '/about/' | absolute_url | jsonify }}},
  "mainEntityOfPage": {"@type": "WebPage", "@id": {{ canonical_url | jsonify }}},
  {% if page.image %}"image": {{ page.image | absolute_url | jsonify }},{% endif %}
  "keywords": {{ page.tags | join: ', ' | jsonify }},
  {% elsif page.url == '/' %}
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  {% else %}
  "@type": "WebPage",
  "name": {{ page_title | jsonify }},
  "isPartOf": {"@type": "WebSite", "name": {{ site.title | jsonify }}, "url": {{ '/' | absolute_url | jsonify }}},
  {% endif %}
  "url": {{ canonical_url | jsonify }},
  "description": {{ page_description | jsonify }},
  "inLanguage": {{ page_language | jsonify }}
}
</script>
