<header class="site-nav">
  <nav class="nav-inner" aria-label="Main navigation">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="najx home">
      <img src="{{ '/assets/img/na.svg' | relative_url }}" alt="" width="30" height="30">
      <span>najx<span class="brand-suffix">.dev</span></span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" hidden>Menu</button>
    <div class="nav-links" id="nav-links">
      {% for menu in site.data.menus.header %}
      <a href="{% if menu.external %}{{ menu.url }}{% else %}{{ menu.url | relative_url }}{% endif %}"{% if page.url == menu.url %} aria-current="page"{% endif %}{% if menu.external %} target="_blank" rel="noopener"{% endif %}>{{ menu.title | escape }}</a>
      {% endfor %}
      <a href="{{ '/feed.xml' | relative_url }}" aria-label="Subscribe via RSS">RSS <span aria-hidden="true">↗</span></a>
    </div>
    <button id="mode" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" hidden>
      <svg class="mode-sunny" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      <svg class="mode-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
    </button>
  </nav>
</header>
